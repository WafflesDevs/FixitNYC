# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard: New → Blueprint → connect this repo (or `render blueprints launch`).
services:
  - type: web
    name: fixitnyc
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: uv sync --frozen
    startCommand: uv run uvicorn fixitnyc.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.0"
      - key: UV_VERSION
        value: "0.12.10"
      - key: VORTEX_MODEL
        value: claude-haiku-4-5
      # Required secrets — paste in Render Dashboard when applying the Blueprint
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BOOTSTRAP_STAFF_EMAILS
        sync: false
